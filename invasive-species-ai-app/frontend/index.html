<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Espécies Invasoras — Protótipo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside>
      <h1>Espécies Invasoras</h1>
      <p style="font-size:12px; color: #555; margin-top:-5px;">Protótipo para visualização, indicadores e relatório automático.</p>
      
      <label>Filtrar espécies no Mapa</label>
      <div class="custom-multiselect" id="speciesDropdownContainer">
        <div class="multiselect-header" onclick="toggleDropdown('speciesOptions')">
          <span id="speciesSelectLabel">Selecionar Espécies...</span> <span>▼</span>
        </div>
<div class="multiselect-options" id="speciesOptions" hidden>
  <div class="multiselect-actions">
    <button onclick="setAll('speciesOptions', false)">Limpar</button>
  </div>
  <div class="multiselect-search">
    <input type="text" placeholder="Procurar..." onkeyup="filterOptions(this, 'speciesOptions')">
  </div>
  <div class="options-list">
    </div>
</div>
</div>
      
      <label>Filtrar por municípios</label>
      <div class="custom-multiselect" id="muniDropdownContainer">
        <div class="multiselect-header" onclick="toggleDropdown('muniOptions')">
          <span id="muniSelectLabel">Todos os municípios</span> <span>▼</span>
        </div>
        <div class="multiselect-options" id="muniOptions" hidden>
          <div class="multiselect-actions">
            <button onclick="setAll('muniOptions', false)">Limpar</button>
          </div>
          <div class="multiselect-search"><input type="text" placeholder="Procurar..." onkeyup="filterOptions(this, 'muniOptions')"></div>
          <div class="options-list"></div>
        </div>
      </div>

      <div id="rasterCardsContainer"></div>

      <label for="reportLevel">Nível do relatório</label>
      <select id="reportLevel">
        <option value="tecnico">Técnico</option>
        <option value="executivo">Executivo</option>
        <option value="publico">Público geral</option>
      </select>
      
      <h2>Indicadores</h2>
      <div id="summary">A carregar indicadores...</div>
      <div id="chartsPanel" hidden></div>
      
      <div class="report-actions">
        <button id="templateButton">Gerar relatório por template</button>
        <button id="reportButton">Gerar relatório com IA</button>
      </div>

      <h2>Mapa de sobreposição</h2>
      <button id="combinedMapButton" disabled>Gerar mapa de zonas muito invasivas</button>
      <div id="combinedMapResult"></div>

      <h2>Relatório</h2>
      <button id="pdfButton" class="pdf-button" disabled>Converter para PDF</button>
      <pre id="report">O relatório será apresentado aqui.</pre>
    </aside>
    <div id="map"></div>

    <script src="script.js"></script>
  </body>
</html>
