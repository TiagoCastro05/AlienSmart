<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Espécies Invasoras — Protótipo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- 1º OBRIGATÓRIO: Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    
    <style>
      body { margin: 0; font-family: Arial, sans-serif; display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
      aside { padding: 16px; background: #f4f6f4; border-right: 1px solid #d0d0d0; overflow-y: auto; }
      h1 { font-size: 22px; margin-top: 0; }
      h2 { font-size: 16px; margin-top: 16px; margin-bottom: 8px; }
      label { font-weight: bold; display: block; margin-top: 12px; font-size: 13px; }
      select, button { width: 100%; padding: 8px; margin-top: 6px; margin-bottom: 10px; box-sizing: border-box; font-size: 13px; }
      button { cursor: pointer; border: none; background: #2d6a4f; color: white; font-weight: bold; border-radius: 4px; }
      button:hover { background: #1b4332; }
      button:disabled { background: #a0a0a0; cursor: not-allowed; opacity: 0.6; }
      #map { height: 100vh; }
      .metric { background: white; padding: 10px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; line-height: 1.4; }
      pre { background: white; border: 1px solid #ddd; padding: 12px; white-space: pre-wrap; border-radius: 6px; font-size: 12px; }
      .chart-card { background: white; padding: 10px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #ddd; }
      .chart-card h3 { margin: 6px 0 10px; font-size: 14px; }
      .report-actions { display: grid; gap: 8px; }
      .pdf-button { width: auto; padding: 6px 12px; margin-top: 8px; margin-bottom: 12px; font-size: 12px; font-weight: bold; }
      .raster-controls { background: white; padding: 14px; border-radius: 6px; border: 2px solid #2d6a4f; margin-bottom: 10px; }
      .raster-controls label { font-size: 13px; color: #333; margin-top: 8px; }
      .raster-controls select { padding: 6px; margin-bottom: 4px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; }
      .raster-info { background: #e8f5e9; padding: 8px; border-radius: 4px; margin-top: 12px; font-size: 12px; color: #2d6a4f; }
      .raster-legend { background: white; padding: 10px 14px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.25); border: 1px solid #ddd; min-width: 160px; }
  .raster-legend h4 { margin: 0 0 7px 0; font-size: 12px; color: #1b4332; }
  .legend-gradient { width: 100%; height: 13px; border-radius: 3px; border: 1px solid #bbb; margin-bottom: 3px; }
  .legend-labels { display: flex; justify-content: space-between; font-size: 10px; color: #666; }
  .legend-binary { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #333; }
  .legend-swatch { width: 18px; height: 18px; border-radius: 3px; border: 1px solid #aaa; flex-shrink: 0; }
    </style>
  </head>
  <body>
    <aside>
      <h1>Espécies Invasoras</h1>
      <p style="font-size:12px; color: #555; margin-top:-5px;">Protótipo para visualização, indicadores e relatório automático.</p>
      
      <label for="speciesFilter">Filtrar por espécie</label>
      <select id="speciesFilter">
        <option value="">Todas as espécies</option>
      </select>
      
      <label for="municipalityFilter">Filtrar por município</label>
      <select id="municipalityFilter">
        <option value="">Todos os municípios</option>
      </select>

      <!-- Controles de Rasters -->
      <div id="rasterControls" class="raster-controls" hidden>
        <h3 style="margin-top: 0; margin-bottom: 8px; color: #2d6a4f;">Dados Raster (SDM)</h3>

        <label>Período Temporal</label>
        <select id="periodFilter">
          <option value="hist">Histórico (1981-2024)</option>
          <option value="2041-2070">Futuro Médio (2041-2070)</option>
          <option value="2071-2100">Futuro Longo (2071-2100)</option>
        </select>

        <div id="scenarioContainer" hidden>
          <label>Cenário Climático (SSP)</label>
          <select id="scenarioFilter">
            <option value="ssp126">SSP1-2.6 (Emissões Baixas)</option>
            <option value="ssp370" selected>SSP3-7.0 (Emissões Intermédias)</option>
            <option value="ssp585">SSP5-8.5 (Emissões Altas)</option>
          </select>
        </div>

        <label>Tipo de Raster</label>
        <select id="binaryFilter">
          <option value="true">Binário (presença/ausência)</option>
          <option value="false">Contínuo (probabilidade)</option>
        </select>

        <div id="colormapContainer" hidden>
          <label>Paleta de Cores</label>
          <select id="colormapFilter">
            <option value="Greens5" selected>Greens5 (Verdes)</option>
            <option value="YlOrRd">YlOrRd (Amarelo-Vermelho)</option>
            <option value="Greens">Greens</option>
            <option value="Blues">Blues</option>
            <option value="RdPu">RdPu (Rosa-Púrpura)</option>
          </select>
        </div>

        <div id="rasterInfo" class="raster-info"></div>
      </div>

      <label for="reportLevel">Nível do relatório</label>
      <select id="reportLevel">
        <option value="tecnico">Técnico</option>
        <option value="executivo">Executivo</option>
        <option value="publico">Público geral</option>
      </select>
      
      <h2>Indicadores</h2>
      <div id="summary">A carregar indicadores...</div>
      <div id="chartsPanel" hidden></div>
      
      <div class="report-actions">
        <button id="templateButton">Gerar relatório por template</button>
        <button id="reportButton">Gerar relatório com IA</button>
      </div>
      
      <h2>Relatório</h2>
      <button id="pdfButton" class="pdf-button" disabled>Converter para PDF</button>
      <pre id="report">O relatório será apresentado aqui.</pre>
    </aside>
    <div id="map"></div>

    <script>
      const API_URL = "http://localhost:8000";
      const map = L.map("map").setView([39.3999, -8.2245], 6);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      let records = [];
      let markers = [];
      let speciesChart, municipalityChart, speciesDistributionChart;

      // Estado dos rasters
      let currentRasterLayer = null;
      let currentPeriod = "hist";
      let currentScenario = "ssp370";
      let currentBinary = true;
      let currentRasterFetchId = 0;
      let currentRasterAbortController = null;

      // GeoJSON dos municípios — CAOP, WGS84, campo "Concelho" em maiúsculas
      const MUNICIPIOS_GEOJSON_URL = "https://raw.githubusercontent.com/nmota/caop_GeoJSON/master/Portugal_Municipalities.geojson";
      let municipiosGeoJSON = null;
      let municipioHighlightLayer = null;

      async function loadMunicipiosGeoJSON() {
        if (municipiosGeoJSON) return municipiosGeoJSON;
        try {
          const resp = await fetch(MUNICIPIOS_GEOJSON_URL);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          municipiosGeoJSON = await resp.json();
          console.log(`[municipios] Carregados ${municipiosGeoJSON.features.length} municípios`);
        } catch (e) {
          console.error("[municipios] Erro:", e);
        }
        return municipiosGeoJSON;
      }


      async function highlightMunicipality(municipalityName) {
        if (municipioHighlightLayer) {
          map.removeLayer(municipioHighlightLayer);
          municipioHighlightLayer = null;
        }
        if (!municipalityName) return;

        try {
          const geojson = await loadMunicipiosGeoJSON();
          if (!geojson) return;

          // Normalizar para comparação (ignora maiúsculas e acentos)
          const norm = s => s.toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
          const procurado = norm(municipalityName);

          // Campo "Concelho" no GeoJSON da CAOP está em maiúsculas
          const feature = geojson.features.find(f =>
            norm(f.properties.Concelho || "") === procurado
          );

          if (!feature || !feature.geometry) {
            console.warn("Município não encontrado:", municipalityName);
            return;
          }

          municipioHighlightLayer = L.geoJSON(feature, {
            style: {
              color: "#cc0000",
              weight: 3,
              fillColor: "#ff4444",
              fillOpacity: 0.15,
              dashArray: "6 3",
            }
          }).addTo(map);

          map.fitBounds(municipioHighlightLayer.getBounds(), { padding: [40, 40] });

        } catch (e) {
          console.error("Erro ao highlight município:", e);
        }
      }

      // =====================================================
      // EVENTOS DOS FILTROS DE RASTER
      // =====================================================

      document.getElementById("periodFilter").addEventListener("change", (e) => {
        currentPeriod = e.target.value;
        // Mostrar/esconder cenário conforme o período selecionado
        document.getElementById("scenarioContainer").hidden = (currentPeriod === "hist");
        triggerRasterUpdate();
      });

      document.getElementById("scenarioFilter").addEventListener("change", (e) => {
        currentScenario = e.target.value;
        triggerRasterUpdate();
      });

      document.getElementById("binaryFilter").addEventListener("change", (e) => {
        currentBinary = e.target.value === "true";
        triggerRasterUpdate();
      });

      document.getElementById("colormapFilter").addEventListener("change", (e) => {
        triggerRasterUpdate();
      });

      function triggerRasterUpdate() {
        const selectedSpecies = document.getElementById("speciesFilter").value;
        if (selectedSpecies) {
          showRasterLayer(selectedSpecies);
        }
      }

      // =====================================================
      // LOADERS
      // =====================================================

      async function loadRecords() {
        const response = await fetch(`${API_URL}/records`);
        records = await response.json();
        showMarkers(records);
      }

      async function loadSpecies() {
        const response = await fetch(`${API_URL}/species`);
        const speciesList = await response.json();
        const select = document.getElementById("speciesFilter");
        speciesList.forEach((species) => {
          const option = document.createElement("option");
          option.value = species;
          option.textContent = species;
          select.appendChild(option);
        });
      }

      // Lista completa dos 308 municípios de Portugal
      const TODOS_MUNICIPIOS = [
        "Abrantes","Águeda","Aguiar da Beira","Alandroal","Albergaria-a-Velha","Albufeira","Alcácer do Sal","Alcanena","Alcobaça","Alcochete","Alcoutim","Alenquer","Alfândega da Fé","Alijó","Aljezur","Aljustrel","Almada","Almeida","Almeirim","Almodôvar","Alpiarça","Alter do Chão","Alvaiázere","Alvito","Amadora","Amarante","Amares","Anadia","Angra do Heroísmo","Ansião","Arcos de Valdevez","Arganil","Armamar","Arouca","Arraiolos","Arronches","Arruda dos Vinhos","Aveiro","Avis","Azambuja",
        "Baião","Barcelos","Barrancos","Barreiro","Batalha","Beja","Belmonte","Benavente","Bombarral","Borba","Boticas","Braga","Bragança","Cabeceiras de Basto","Cadaval","Caldas da Rainha","Câmara de Lobos","Caminha","Cantanhede","Carregal do Sal","Cartaxo","Cascais","Castanheira de Pêra","Castelo Branco","Castelo de Paiva","Castelo de Vide","Castro Daire","Castro Marim","Castro Verde","Celorico da Beira","Celorico de Basto","Chamusca","Chaves","Cinfães","Coimbra","Condeixa-a-Nova","Constância","Coruche","Covilhã","Crato","Cuba",
        "Elvas","Entroncamento","Espinho","Esposende","Estarreja","Estremoz","Évora","Fafe","Faro","Felgueiras","Ferreira do Alentejo","Ferreira do Zêzere","Figueira da Foz","Figueira de Castelo Rodrigo","Figueiró dos Vinhos","Fornos de Algodres","Freixo de Espada à Cinta","Fronteira","Funchal","Fundão",
        "Gavião","Góis","Golegã","Gondomar","Gouveia","Grândola","Guarda","Guimarães","Horta","Idanha-a-Nova","Ílhavo","Lagoa","Lagos","Lamego","Leiria","Lisboa","Loulé","Loures","Lousã","Lousada","Mação","Macedo de Cavaleiros","Machico","Mafra","Maia","Mangualde","Manteigas","Marco de Canaveses","Marinha Grande","Marvão","Matosinhos","Mealhada","Mêda","Melgaço","Mesão Frio","Miranda do Corvo","Miranda do Douro","Mirandela","Mogadouro","Moimenta da Beira","Moita","Monção","Monchique","Mondim de Basto","Monforte","Montalegre","Montemor-o-Novo","Montemor-o-Velho","Montijo","Mora","Mortágua","Moura","Mourão","Murça","Murtosa",
        "Nazaré","Nelas","Nisa","Nordeste","Óbidos","Odemira","Odivelas","Oeiras","Olhão","Oliveira de Azeméis","Oliveira de Frades","Oliveira do Bairro","Oliveira do Hospital","Ourém","Ourique","Ovar","Paços de Ferreira","Palmela","Pampilhosa da Serra","Paredes","Paredes de Coura","Pedrogão Grande","Penacova","Penafiel","Penalva do Castelo","Penamacor","Penedono","Penela","Peniche","Peso da Régua","Pinhel","Pombal","Ponte da Barca","Ponte de Lima","Ponte de Sor","Portalegre","Portel","Portimão","Porto","Porto de Mós","Porto Moniz","Porto Santo","Póvoa de Lanhoso","Póvoa de Varzim","Praia da Vitória",
        "Proença-a-Nova","Resende","Ribeira Brava","Ribeira de Pena","Ribeira Grande","Rio Maior","Sabrosa","Sabugal","Salvaterra de Magos","Santa Comba Dão","Santa Cruz","Santa Cruz da Graciosa","Santa Cruz das Flores","Santa Maria da Feira","Santa Marta de Penaguião","Santarém","Santiago do Cacém","Santo Tirso","São Brás de Alportel","São João da Madeira","São João da Pesqueira","São Pedro do Sul","São Roque do Pico","São Vicente","Sardoal","Sátão","Seia","Seixal","Sernancelhe","Serpa","Sertã","Sesimbra","Setúbal","Sever do Vouga","Silves","Sines","Sintra","Sobral de Monte Agraço","Soure","Sousel",
        "Tábua","Tabuaço","Tarouca","Tavira","Terras de Bouro","Tomar","Tondela","Torre de Moncorvo","Torres Novas","Torres Vedras","Trancoso","Trofa","Vagos","Vale de Cambra","Valença","Valongo","Valpaços","Vendas Novas","Viana do Alentejo","Viana do Castelo","Vidigueira","Vieira do Minho","Vila de Rei","Vila do Bispo","Vila do Conde","Vila do Porto","Vila Flor","Vila Franca de Xira","Vila Franca do Campo","Vila Nova da Barquinha","Vila Nova de Cerveira","Vila Nova de Famalicão","Vila Nova de Foz Côa","Vila Nova de Gaia","Vila Nova de Paiva","Vila Nova de Poiares","Vila Pouca de Aguiar","Vila Real","Vila Real de Santo António","Vila Velha de Ródão","Vila Verde","Vila Viçosa","Vimioso","Vinhais","Viseu","Vizela","Vouzela"
      ].sort((a, b) => a.localeCompare(b, "pt"));

      async function loadMunicipalities() {
        const select = document.getElementById("municipalityFilter");
        TODOS_MUNICIPIOS.forEach((nome) => {
          const option = document.createElement("option");
          option.value = nome;
          option.textContent = nome;
          select.appendChild(option);
        });
      }

      // =====================================================
      // RENDERIZAÇÃO DE RASTERS (overlay PNG via backend)
      // =====================================================

      async function showRasterLayer(species) {
        console.log(`[raster] showRasterLayer species=${species} period=${currentPeriod} scenario=${currentScenario}`);

        document.getElementById("colormapContainer").hidden = currentBinary;

        // Remover camada antiga imediatamente para dar feedback visual
        if (currentRasterLayer) {
          map.removeLayer(currentRasterLayer);
          currentRasterLayer = null;
        }

        // Cancelar pedido anterior
        if (currentRasterAbortController) currentRasterAbortController.abort();
        currentRasterAbortController = new AbortController();
        const { signal } = currentRasterAbortController;
        currentRasterFetchId++;
        const myFetchId = currentRasterFetchId;

        try {
          const encodedSpecies = encodeURIComponent(species);
          const colormap = document.getElementById("colormapFilter").value;

          // Construir URL com período e cenário (cenário só para períodos futuros)
          let overlayInfoUrl = `${API_URL}/raster/overlay-info/${encodedSpecies}?period=${currentPeriod}&colormap=${colormap}&binary=${currentBinary}`;
          if (currentPeriod !== "hist") {
            overlayInfoUrl += `&scenario=${currentScenario}`;
          }

          const overlayInfoResp = await fetch(overlayInfoUrl, { signal });
          if (!overlayInfoResp.ok) throw new Error(`Overlay info failed: ${overlayInfoResp.status}`);
          const overlayInfo = await overlayInfoResp.json();

          if (currentRasterFetchId !== myFetchId) return;

          console.log("Bounds recebidos:", JSON.stringify(overlayInfo.bounds));

          // Cache buster para forçar nova imagem
          const cacheBuster = `cb=${Date.now()}_${Math.random().toString(16).slice(2)}`;
          const baseTileUrl = `${API_URL}${overlayInfo.tile_url}`;
          const tileUrl = baseTileUrl.includes("?")
            ? `${baseTileUrl}&${cacheBuster}`
            : `${baseTileUrl}?${cacheBuster}`;

          document.getElementById("rasterControls").hidden = false;

          currentRasterLayer = L.imageOverlay(tileUrl, overlayInfo.bounds, {
            opacity: 0.7,
          }).addTo(map);

          rasterLegend.update(currentBinary, document.getElementById("colormapFilter").value);

          map.fitBounds(overlayInfo.bounds);

          // Atualizar info text com estatísticas (área e resumo)
          let areaUrl = `${API_URL}/raster/suitable-area/${encodedSpecies}?period=${currentPeriod}`;
          if (currentPeriod !== "hist") {
            areaUrl += `&scenario=${currentScenario}`;
          }

          const [areaResponse, summaryResponse] = await Promise.all([
            fetch(areaUrl, { signal }).catch(() => null),
            fetch(`${API_URL}/raster/summary/${encodedSpecies}`, { signal }).catch(() => null)
          ]);

          if (currentRasterFetchId === myFetchId) {
            let areaInfo = 'Área não disponível';
            if (areaResponse && areaResponse.ok) {
              const areaData = await areaResponse.json();
              if (areaData.data && areaData.data.suitable_area_km2 !== undefined) {
                areaInfo = `${areaData.data.suitable_area_km2.toLocaleString()} km² adequados (${areaData.data.suitable_pct}%)`;
              }
            }

            let extraInfo = '';
            if (summaryResponse && summaryResponse.ok) {
              const summaryData = await summaryResponse.json();
              const trend = summaryData.scenario_analysis?.summary?.trend;
              if (trend) {
                const trendIcon = trend === 'expansão' ? '↗️' : (trend === 'contração' ? '↘️' : '➡️');
                extraInfo = `<br>Tendência (futuro): ${trendIcon} <strong>${trend}</strong>`;
              }
              
              if (currentPeriod !== "hist" && summaryData.temporal_comparison?.changes) {
                const changes = summaryData.temporal_comparison.changes;
                const changeKey = currentPeriod === "2041-2070" ? "hist_to_2041_2070_pct" : "hist_to_2071_2100_pct";
                const changeVal = changes[changeKey];
                if (changeVal !== undefined) {
                  const signal = changeVal > 0 ? '+' : '';
                  extraInfo += `<br>Variação face a histórico: ${signal}${changeVal}%`;
                }
              }
            }

            const info = document.getElementById("rasterInfo");
            const periodText = currentPeriod === "hist" ? "Histórico" : `Futuro (${currentPeriod})`;
            const scenarioText = currentPeriod !== "hist" ? ` | Cenário: ${currentScenario.toUpperCase()}` : "";
            info.innerHTML = `
              <strong>${species}</strong><br>
              Período: ${periodText}${scenarioText}<br>
              ${areaInfo}
              ${extraInfo}
            `;
          }

        } catch (error) {
          if (error && error.name === "AbortError") return;
          console.error("Erro ao desenhar Raster:", error);
          document.getElementById("rasterInfo").innerHTML = `<strong>Aviso:</strong> Sem modelo SDM para esta data/cenário.`;
        }
      }

      // =====================================================
      // INDICADORES E GRÁFICOS
      // =====================================================

      async function loadSummary() {
        const response = await fetch(`${API_URL}/summary`);
        const summary = await response.json();
        
        let hotspotLines = "<li>Nenhum hotspot definido.</li>";
        if (summary.hotspots && summary.hotspots.length > 0) {
          hotspotLines = summary.hotspots.map((h) => `<li>${h.municipality}: ${h.records} registos</li>`).join("");
        }

        document.getElementById("summary").innerHTML = `
          <div class="metric"><strong>Total de registos:</strong><br>${summary.total_records}</div>
          <div class="metric"><strong>Espécie dominante:</strong><br>${summary.most_common_species}</div>
          <div class="metric"><strong>Município dominante:</strong><br>${summary.most_common_municipality}</div>
          ${summary.hotspots ? `<h3>Hotspots simples</h3><ul>${hotspotLines}</ul>` : ""}
          <h3>Distribuição por espécie</h3>
          <canvas id="speciesDistributionChart" style="max-height: 200px;"></canvas>
        `;
        renderCharts(summary);
      }

      function renderCharts(summary) {
        const chartPanel = document.getElementById("chartsPanel");
        if (!chartPanel.hasChildNodes()) {
          chartPanel.hidden = false;
          chartPanel.innerHTML = `
            <div class="chart-card"><h3>Registos por espécie</h3><canvas id="speciesChart"></canvas></div>
            <div class="chart-card"><h3>Registos por município</h3><canvas id="municipalityChart"></canvas></div>
          `;
        }

        const speciesData = summary.species_count || {};
        const municipalityData = summary.municipality_count || {};
        const speciesLabels = Object.keys(speciesData);
        const speciesValues = Object.values(speciesData);
        const municipalityLabels = Object.keys(municipalityData);
        const municipalityValues = Object.values(municipalityData);

        if (speciesChart) speciesChart.destroy();
        if (municipalityChart) municipalityChart.destroy();
        if (speciesDistributionChart) speciesDistributionChart.destroy();

        speciesChart = new Chart(document.getElementById("speciesChart"), {
          type: "bar",
          data: { labels: speciesLabels, datasets: [{ label: "Registos", data: speciesValues, backgroundColor: "#2d6a4f" }] },
          options: { responsive: true, plugins: { legend: { display: false } } },
        });

        municipalityChart = new Chart(document.getElementById("municipalityChart"), {
          type: "bar",
          data: { labels: municipalityLabels, datasets: [{ label: "Registos", data: municipalityValues, backgroundColor: "#1b4332" }] },
          options: { responsive: true, plugins: { legend: { display: false } } },
        });

        speciesDistributionChart = new Chart(document.getElementById("speciesDistributionChart"), {
          type: "doughnut",
          data: {
            labels: speciesLabels,
            datasets: [{ label: "Registos", data: speciesValues, backgroundColor: ["#2d6a4f", "#1b4332", "#40916c", "#52b788", "#74c69d", "#b7e4c7", "#d8f3dc"], borderWidth: 2 }]
          },
          options: { responsive: true, plugins: { legend: { position: "bottom" } } },
        });
      }

      // =====================================================
      // MARCADORES E FILTROS
      // =====================================================

      function showMarkers(data) {
        markers.forEach((marker) => marker.remove());
        markers = [];
        data.forEach((record) => {
          const marker = L.marker([record.latitude, record.longitude]).addTo(map)
            .bindPopup(`<strong>${record.species}</strong><br>Município: ${record.municipality}<br>Data: ${record.date}<br>Fonte: ${record.source}`);
          markers.push(marker);
        });
      }

      async function filterBySpecies() {
        const selectedSpecies = document.getElementById("speciesFilter").value;
        const selectedMunicipality = document.getElementById("municipalityFilter").value;
        const filteredRecords = records.filter((record) => {
          const speciesMatch = !selectedSpecies || record.species.replace(/_/g, " ") === selectedSpecies.replace(/_/g, " ");
          const municipalityMatch = !selectedMunicipality || record.municipality === selectedMunicipality;
          return speciesMatch && municipalityMatch;
        });
        showMarkers(filteredRecords);

        // Highlight do município selecionado
        await highlightMunicipality(selectedMunicipality);

        if (selectedSpecies) {
          document.getElementById("rasterControls").hidden = false;
          await showRasterLayer(selectedSpecies);
        } else {
          // Limpar raster se "Todas as espécies" for selecionado
          rasterLegend._div.style.display = "none";
          currentRasterFetchId++;
          if (currentRasterAbortController) currentRasterAbortController.abort();
          if (currentRasterLayer) {
            map.removeLayer(currentRasterLayer);
            currentRasterLayer = null;
          }
          document.getElementById("rasterControls").hidden = true;
        }
      }

      async function filterByMunicipality() {
        await filterBySpecies();
      }

      // =====================================================
      // RELATÓRIOS
      // =====================================================

      async function generateTemplateReport() {
        document.getElementById("report").textContent = "A gerar relatório por template...";
        const level = document.getElementById("reportLevel").value;
        const selectedSpecies = document.getElementById("speciesFilter").value;
        const selectedMunicipality = document.getElementById("municipalityFilter").value;
        const params = new URLSearchParams({ level });
        if (selectedSpecies) params.append("species", selectedSpecies);
        if (selectedMunicipality) params.append("municipality", selectedMunicipality);
        const response = await fetch(`${API_URL}/report-template?${params.toString()}`, { method: "POST" });
        const data = await response.json();
        document.getElementById("report").textContent = data.report;
        document.getElementById("pdfButton").disabled = false;
      }

      async function generateAIReport() {
        document.getElementById("report").textContent = "A gerar relatório com IA...";
        const level = document.getElementById("reportLevel").value;
        const selectedSpecies = document.getElementById("speciesFilter").value;
        const selectedMunicipality = document.getElementById("municipalityFilter").value;
        const params = new URLSearchParams({ level });
        if (selectedSpecies) params.append("species", selectedSpecies);
        if (selectedMunicipality) params.append("municipality", selectedMunicipality);
        const response = await fetch(`${API_URL}/report?${params.toString()}`, { method: "POST" });
        const data = await response.json();
        const validationText = data.validation ? `\n\nValidação automática:\n${JSON.stringify(data.validation, null, 2)}` : "";
        document.getElementById("report").textContent = `[Fonte: ${data.source} | Nivel: ${data.level}]\n\n${data.report}${validationText}`;
        document.getElementById("pdfButton").disabled = false;
      }

      function exportPdf() {
        const level = document.getElementById("reportLevel").value;
        const selectedSpecies = document.getElementById("speciesFilter").value;
        const selectedMunicipality = document.getElementById("municipalityFilter").value;
        const params = new URLSearchParams({ level });
        if (selectedSpecies) params.append("species", selectedSpecies);
        if (selectedMunicipality) params.append("municipality", selectedMunicipality);
        window.open(`${API_URL}/report/pdf?${params.toString()}`, "_blank");
      }

      // =====================================================
// LEGENDA DO RASTER
// =====================================================

const COLORMAP_STOPS = {
  "Greens5": ["#edf8e9", "#bae4b3", "#74c476", "#31a354", "#006d2c"],
  "YlOrRd":  ["#ffffcc", "#fed976", "#fd8d3c", "#e31a1c", "#800026"],
  "Greens":  ["#edf8e9", "#bae4b3", "#74c476", "#31a354", "#006d2c"],
  "Blues":   ["#eff3ff", "#bdd7e7", "#6baed6", "#3182bd", "#08519c"],
  "RdPu":    ["#feebe2", "#fbb4b9", "#f768a1", "#ae017e", "#49006a"],
};

const rasterLegend = L.control({ position: "bottomright" });
rasterLegend.onAdd = function () {
  this._div = L.DomUtil.create("div", "raster-legend");
  this._div.style.display = "none";
  return this._div;
};
rasterLegend.update = function (isBinary, colormap) {
  if (isBinary) {
    this._div.innerHTML = `
      <h4>Distribuição (SDM)</h4>
      <div class="legend-binary">
        <div class="legend-swatch" style="background:#2d6a4f; opacity:0.78;"></div>
        <span>Presença confirmada</span>
      </div>
      <div class="legend-binary" style="margin-top:5px;">
        <div class="legend-swatch" style="background:transparent;"></div>
        <span style="color:#aaa;">Ausência</span>
      </div>`;
  } else {
    const stops = COLORMAP_STOPS[colormap] || COLORMAP_STOPS["Greens5"];
    const gradient = `linear-gradient(to right, ${stops.join(", ")})`;
    this._div.innerHTML = `
      <h4>Adequabilidade (SDM)</h4>
      <div class="legend-gradient" style="background:${gradient};"></div>
      <div class="legend-labels"><span>0 — Baixa</span><span>1 — Alta</span></div>`;
  }
  this._div.style.display = "block";
};
rasterLegend.addTo(map);



      // =====================================================
      // EVENT LISTENERS E ARRANQUE
      // =====================================================

      document.getElementById("speciesFilter").addEventListener("change", filterBySpecies);
      document.getElementById("municipalityFilter").addEventListener("change", filterByMunicipality);
      document.getElementById("templateButton").addEventListener("click", generateTemplateReport);
      document.getElementById("reportButton").addEventListener("click", generateAIReport);
      document.getElementById("pdfButton").addEventListener("click", exportPdf);

      loadRecords();
      loadSpecies();
      loadMunicipalities();
      loadSummary();
    </script>
  </body>
</html>
