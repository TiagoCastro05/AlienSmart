<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Espécies Invasoras — Protótipo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- 1º OBRIGATÓRIO: Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    
    <style>
      body { margin: 0; font-family: Arial, sans-serif; display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
      aside { padding: 16px; background: #f4f6f4; border-right: 1px solid #d0d0d0; overflow-y: auto; }
      h1 { font-size: 22px; margin-top: 0; }
      h2 { font-size: 16px; margin-top: 16px; margin-bottom: 8px; }
      label { font-weight: bold; display: block; margin-top: 12px; font-size: 13px; }
      select, button { width: 100%; padding: 8px; margin-top: 6px; margin-bottom: 10px; box-sizing: border-box; font-size: 13px; }
      button { cursor: pointer; border: none; background: #2d6a4f; color: white; font-weight: bold; border-radius: 4px; }
      button:hover { background: #1b4332; }
      button:disabled { background: #a0a0a0; cursor: not-allowed; opacity: 0.6; }
      #map { height: 100vh; }
      .metric { background: white; padding: 10px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; line-height: 1.4; }
      pre { background: white; border: 1px solid #ddd; padding: 12px; white-space: pre-wrap; border-radius: 6px; font-size: 12px; }
      .chart-card { background: white; padding: 10px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #ddd; }
      .chart-card h3 { margin: 6px 0 10px; font-size: 14px; }
      .report-actions { display: grid; gap: 8px; }
      .pdf-button { width: auto; padding: 6px 12px; margin-top: 8px; margin-bottom: 12px; font-size: 12px; font-weight: bold; }
      .raster-controls { background: white; padding: 14px; border-radius: 6px; border: 2px solid #2d6a4f; margin-bottom: 10px; }
      .raster-controls label { font-size: 13px; color: #333; margin-top: 8px; }
      .raster-controls select { padding: 6px; margin-bottom: 4px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; }
      .raster-info { background: #e8f5e9; padding: 8px; border-radius: 4px; margin-top: 12px; font-size: 12px; color: #2d6a4f; }
    </style>
  </head>
  <body>
    <aside>
      <h1>Espécies Invasoras</h1>
      <p style="font-size:12px; color: #555; margin-top:-5px;">Protótipo para visualização, indicadores e relatório automático.</p>
      
      <label for="speciesFilter">Filtrar por espécie</label>
      <select id="speciesFilter">
        <option value="">Todas as espécies</option>
      </select>
      
      <label for="municipalityFilter">Filtrar por município</label>
      <select id="municipalityFilter">
        <option value="">Todos os municípios</option>
      </select>

      <!-- Controles de Rasters -->
      <div id="rasterControls" class="raster-controls" hidden>
        <h3 style="margin-top: 0; margin-bottom: 8px; color: #2d6a4f;">Dados Raster (SDM)</h3>

        <label>Período Temporal</label>
        <select id="periodFilter">
          <option value="hist">Histórico (1981-2024)</option>
          <option value="2041-2070">Futuro Médio (2041-2070)</option>
          <option value="2071-2100">Futuro Longo (2071-2100)</option>
        </select>

        <div id="scenarioContainer" hidden>
          <label>Cenário Climático (SSP)</label>
          <select id="scenarioFilter">
            <option value="ssp126">SSP1-2.6 (Emissões Baixas)</option>
            <option value="ssp370" selected>SSP3-7.0 (Emissões Intermédias)</option>
            <option value="ssp585">SSP5-8.5 (Emissões Altas)</option>
          </select>
        </div>

        <div id="rasterInfo" class="raster-info"></div>
      </div>

      <label for="reportLevel">Nível do relatório</label>
      <select id="reportLevel">
        <option value="tecnico">Técnico</option>
        <option value="executivo">Executivo</option>
        <option value="publico">Público geral</option>
      </select>
      
      <h2>Indicadores</h2>
      <div id="summary">A carregar indicadores...</div>
      <div id="chartsPanel" hidden></div>
      
      <div class="report-actions">
        <button id="templateButton">Gerar relatório por template</button>
        <button id="reportButton">Gerar relatório com IA</button>
      </div>
      
      <h2>Relatório</h2>
      <button id="pdfButton" class="pdf-button" disabled>Converter para PDF</button>
      <pre id="report">O relatório será apresentado aqui.</pre>
    </aside>
    <div id="map"></div>

    <script>
      const API_URL = "http://localhost:8000";
      const map = L.map("map").setView([39.3999, -8.2245], 6);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      let records = [];
      let markers = [];
      let speciesChart, municipalityChart, speciesDistributionChart;

      // Estado dos rasters
      let currentRasterLayer = null;
      let currentPeriod = "hist";
      let currentScenario = "ssp370";
      let currentRasterFetchId = 0;
      let currentRasterAbortController = null;

      // =====================================================
      // EVENTOS DOS FILTROS DE RASTER
      // =====================================================

      document.getElementById("periodFilter").addEventListener("change", (e) => {
        currentPeriod = e.target.value;
        // Mostrar/esconder cenário conforme o período selecionado
        document.getElementById("scenarioContainer").hidden = (currentPeriod === "hist");
        triggerRasterUpdate();
      });

      document.getElementById("scenarioFilter").addEventListener("change", (e) => {
        currentScenario = e.target.value;
        triggerRasterUpdate();
      });

      function triggerRasterUpdate() {
        const selectedSpecies = document.getElementById("speciesFilter").value;
        if (selectedSpecies) {
          showRasterLayer(selectedSpecies);
        }
      }

      // =====================================================
      // LOADERS
      // =====================================================

      async function loadRecords() {
        const response = await fetch(`${API_URL}/records`);
        records = await response.json();
        showMarkers(records);
      }

      async function loadSpecies() {
        const response = await fetch(`${API_URL}/species`);
        const speciesList = await response.json();
        const select = document.getElementById("speciesFilter");
        speciesList.forEach((species) => {
          const option = document.createElement("option");
          option.value = species;
          option.textContent = species;
          select.appendChild(option);
        });
      }

      async function loadMunicipalities() {
        const response = await fetch(`${API_URL}/municipalities`);
        const municipalitiesList = await response.json();
        const select = document.getElementById("municipalityFilter");
        municipalitiesList.forEach((municipality) => {
          const option = document.createElement("option");
          option.value = municipality;
          option.textContent = municipality;
          select.appendChild(option);
        });
      }

      // =====================================================
      // RENDERIZAÇÃO DE RASTERS (overlay PNG via backend)
      // =====================================================

      async function showRasterLayer(species) {
        console.log(`[raster] showRasterLayer species=${species} period=${currentPeriod} scenario=${currentScenario}`);

        // Remover camada antiga imediatamente para dar feedback visual
        if (currentRasterLayer) {
          map.removeLayer(currentRasterLayer);
          currentRasterLayer = null;
        }

        // Cancelar pedido anterior
        if (currentRasterAbortController) currentRasterAbortController.abort();
        currentRasterAbortController = new AbortController();
        const { signal } = currentRasterAbortController;
        currentRasterFetchId++;
        const myFetchId = currentRasterFetchId;

        try {
          const encodedSpecies = encodeURIComponent(species);

          // Construir URL com período e cenário (cenário só para períodos futuros)
          let overlayInfoUrl = `${API_URL}/raster/overlay-info/${encodedSpecies}?period=${currentPeriod}&colormap=Greens5`;
          if (currentPeriod !== "hist") {
            overlayInfoUrl += `&scenario=${currentScenario}`;
          }

          const overlayInfoResp = await fetch(overlayInfoUrl, { signal });
          if (!overlayInfoResp.ok) throw new Error(`Overlay info failed: ${overlayInfoResp.status}`);
          const overlayInfo = await overlayInfoResp.json();

          if (currentRasterFetchId !== myFetchId) return;

          console.log("Bounds recebidos:", JSON.stringify(overlayInfo.bounds));

          // Cache buster para forçar nova imagem
          const cacheBuster = `cb=${Date.now()}_${Math.random().toString(16).slice(2)}`;
          const baseTileUrl = `${API_URL}${overlayInfo.tile_url}`;
          const tileUrl = baseTileUrl.includes("?")
            ? `${baseTileUrl}&${cacheBuster}`
            : `${baseTileUrl}?${cacheBuster}`;

          document.getElementById("rasterControls").hidden = false;

          currentRasterLayer = L.imageOverlay(tileUrl, overlayInfo.bounds, {
            opacity: 0.7,
          }).addTo(map);

          map.fitBounds(overlayInfo.bounds);

          // Atualizar info text com estatísticas
          let statsUrl = `${API_URL}/raster/stats/${encodedSpecies}?period=${currentPeriod}`;
          if (currentPeriod !== "hist") {
            statsUrl += `&scenario=${currentScenario}`;
          }

          const statsResponse = await fetch(statsUrl, { signal });
          if (statsResponse.ok && currentRasterFetchId === myFetchId) {
            const rasterStats = await statsResponse.json();
            const info = document.getElementById("rasterInfo");
            const periodText = currentPeriod === "hist" ? "Histórico" : `Futuro (${currentPeriod})`;
            const scenarioText = currentPeriod !== "hist" ? ` | Cenário: ${currentScenario.toUpperCase()}` : "";
            info.innerHTML = `
              <strong>${species}</strong><br>
              Período: ${periodText}${scenarioText}<br>
              Píxeis ativos: ${rasterStats.stats.count}
            `;
          }

        } catch (error) {
          if (error && error.name === "AbortError") return;
          console.error("Erro ao desenhar Raster:", error);
          document.getElementById("rasterInfo").innerHTML = `<strong>Aviso:</strong> Sem modelo SDM para esta data/cenário.`;
        }
      }

      // =====================================================
      // INDICADORES E GRÁFICOS
      // =====================================================

      async function loadSummary() {
        const response = await fetch(`${API_URL}/summary`);
        const summary = await response.json();
        
        let hotspotLines = "<li>Nenhum hotspot definido.</li>";
        if (summary.hotspots && summary.hotspots.length > 0) {
          hotspotLines = summary.hotspots.map((h) => `<li>${h.municipality}: ${h.records} registos</li>`).join("");
        }

        document.getElementById("summary").innerHTML = `
          <div class="metric"><strong>Total de registos:</strong><br>${summary.total_records}</div>
          <div class="metric"><strong>Espécie dominante:</strong><br>${summary.most_common_species}</div>
          <div class="metric"><strong>Município dominante:</strong><br>${summary.most_common_municipality}</div>
          ${summary.hotspots ? `<h3>Hotspots simples</h3><ul>${hotspotLines}</ul>` : ""}
          <h3>Distribuição por espécie</h3>
          <canvas id="speciesDistributionChart" style="max-height: 200px;"></canvas>
        `;
        renderCharts(summary);
      }

      function renderCharts(summary) {
        const chartPanel = document.getElementById("chartsPanel");
        if (!chartPanel.hasChildNodes()) {
          chartPanel.hidden = false;
          chartPanel.innerHTML = `
            <div class="chart-card"><h3>Registos por espécie</h3><canvas id="speciesChart"></canvas></div>
            <div class="chart-card"><h3>Registos por município</h3><canvas id="municipalityChart"></canvas></div>
          `;
        }

        const speciesData = summary.species_count || {};
        const municipalityData = summary.municipality_count || {};
        const speciesLabels = Object.keys(speciesData);
        const speciesValues = Object.values(speciesData);
        const municipalityLabels = Object.keys(municipalityData);
        const municipalityValues = Object.values(municipalityData);

        if (speciesChart) speciesChart.destroy();
        if (municipalityChart) municipalityChart.destroy();
        if (speciesDistributionChart) speciesDistributionChart.destroy();

        speciesChart = new Chart(document.getElementById("speciesChart"), {
          type: "bar",
          data: { labels: speciesLabels, datasets: [{ label: "Registos", data: speciesValues, backgroundColor: "#2d6a4f" }] },
          options: { responsive: true, plugins: { legend: { display: false } } },
        });

        municipalityChart = new Chart(document.getElementById("municipalityChart"), {
          type: "bar",
          data: { labels: municipalityLabels, datasets: [{ label: "Registos", data: municipalityValues, backgroundColor: "#1b4332" }] },
          options: { responsive: true, plugins: { legend: { display: false } } },
        });

        speciesDistributionChart = new Chart(document.getElementById("speciesDistributionChart"), {
          type: "doughnut",
          data: {
            labels: speciesLabels,
            datasets: [{ label: "Registos", data: speciesValues, backgroundColor: ["#2d6a4f", "#1b4332", "#40916c", "#52b788", "#74c69d", "#b7e4c7", "#d8f3dc"], borderWidth: 2 }]
          },
          options: { responsive: true, plugins: { legend: { position: "bottom" } } },
        });
      }

      // =====================================================
      // MARCADORES E FILTROS
      // =====================================================

      function showMarkers(data) {
        markers.forEach((marker) => marker.remove());
        markers = [];
        data.forEach((record) => {
          const marker = L.marker([record.latitude, record.longitude]).addTo(map)
            .bindPopup(`<strong>${record.species}</strong><br>Município: ${record.municipality}<br>Data: ${record.date}<br>Fonte: ${record.source}`);
          markers.push(marker);
        });
      }

      async function filterBySpecies() {
        const selectedSpecies = document.getElementById("speciesFilter").value;
        const selectedMunicipality = document.getElementById("municipalityFilter").value;
        const filteredRecords = records.filter((record) => {
          const speciesMatch = !selectedSpecies || record.species.replace(/_/g, " ") === selectedSpecies.replace(/_/g, " ");
          const municipalityMatch = !selectedMunicipality || record.municipality === selectedMunicipality;
          return speciesMatch && municipalityMatch;
        });
        showMarkers(filteredRecords);

        if (selectedSpecies) {
          document.getElementById("rasterControls").hidden = false;
          await showRasterLayer(selectedSpecies);
        } else {
          // Limpar raster se "Todas as espécies" for selecionado
          currentRasterFetchId++;
          if (currentRasterAbortController) currentRasterAbortController.abort();
          if (currentRasterLayer) {
            map.removeLayer(currentRasterLayer);
            currentRasterLayer = null;
          }
          document.getElementById("rasterControls").hidden = true;
        }
      }

      function filterByMunicipality() { filterBySpecies(); }

      // =====================================================
      // RELATÓRIOS
      // =====================================================

      async function generateTemplateReport() {
        document.getElementById("report").textContent = "A gerar relatório por template...";
        const level = document.getElementById("reportLevel").value;
        const selectedSpecies = document.getElementById("speciesFilter").value;
        const selectedMunicipality = document.getElementById("municipalityFilter").value;
        const params = new URLSearchParams({ level });
        if (selectedSpecies) params.append("species", selectedSpecies);
        if (selectedMunicipality) params.append("municipality", selectedMunicipality);
        const response = await fetch(`${API_URL}/report-template?${params.toString()}`, { method: "POST" });
        const data = await response.json();
        document.getElementById("report").textContent = data.report;
        document.getElementById("pdfButton").disabled = false;
      }

      async function generateAIReport() {
        document.getElementById("report").textContent = "A gerar relatório com IA...";
        const level = document.getElementById("reportLevel").value;
        const selectedSpecies = document.getElementById("speciesFilter").value;
        const selectedMunicipality = document.getElementById("municipalityFilter").value;
        const params = new URLSearchParams({ level });
        if (selectedSpecies) params.append("species", selectedSpecies);
        if (selectedMunicipality) params.append("municipality", selectedMunicipality);
        const response = await fetch(`${API_URL}/report?${params.toString()}`, { method: "POST" });
        const data = await response.json();
        const validationText = data.validation ? `\n\nValidação automática:\n${JSON.stringify(data.validation, null, 2)}` : "";
        document.getElementById("report").textContent = `[Fonte: ${data.source} | Nivel: ${data.level}]\n\n${data.report}${validationText}`;
        document.getElementById("pdfButton").disabled = false;
      }

      function exportPdf() {
        const level = document.getElementById("reportLevel").value;
        const selectedSpecies = document.getElementById("speciesFilter").value;
        const selectedMunicipality = document.getElementById("municipalityFilter").value;
        const params = new URLSearchParams({ level });
        if (selectedSpecies) params.append("species", selectedSpecies);
        if (selectedMunicipality) params.append("municipality", selectedMunicipality);
        window.open(`${API_URL}/report/pdf?${params.toString()}`, "_blank");
      }

      // =====================================================
      // EVENT LISTENERS E ARRANQUE
      // =====================================================

      document.getElementById("speciesFilter").addEventListener("change", filterBySpecies);
      document.getElementById("municipalityFilter").addEventListener("change", filterByMunicipality);
      document.getElementById("templateButton").addEventListener("click", generateTemplateReport);
      document.getElementById("reportButton").addEventListener("click", generateAIReport);
      document.getElementById("pdfButton").addEventListener("click", exportPdf);

      loadRecords();
      loadSpecies();
      loadMunicipalities();
      loadSummary();
    </script>
  </body>
</html>
